appId: app.versescape.VerseScape
productName: VerseScape
copyright: Copyright © 2026 VerseScape contributors
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true

linux:
  target:
    - AppImage
    - deb
  category: Education
  synopsis: Offline-first Bible study workspace
  desktop:
    entry:
      Categories: Education;Literature;Viewer;

win:
  target:
    - target: nsis
      arch: [x64]
  # No certificate yet — see decision D-12 (free OSS signing routes).

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

publish:
  provider: github
  owner: kelmankenberg
  repo: VerseScape
